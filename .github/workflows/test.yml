name: tests
# Every push and pull request is tested. A push to main is published to the gh-pages branch (which GitHub Pages
# serves) only after the tests pass, so a failing change never reaches the live site.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Python tools compile and parse geometry correctly
        run: |
          python -m py_compile tools/*.py
          python -I tests/test_gpkg.py
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: JavaScript syntax
        run: for f in js/*.js tests/*.mjs; do node --check "$f"; done
      - name: Browser tests
        working-directory: tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          node run.mjs

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: { group: publish, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Publish the tested commit to gh-pages
        run: git push --force origin "${GITHUB_SHA}:refs/heads/gh-pages"
